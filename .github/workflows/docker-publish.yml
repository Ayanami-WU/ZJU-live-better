name: Publish Docker image

on:
  push:
    branches:
      - feat/dockerized
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Run offline regression tests
        run: node --experimental-vm-modules --test tests/*.test.js
      - name: Check JavaScript and entrypoint syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z '*.js')
          sh -n docker/entrypoint.sh

  publish:
    needs: verify
    if: github.ref == 'refs/heads/feat/dockerized' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=dockerized,enable=${{ github.ref == 'refs/heads/feat/dockerized' }}
      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test published image without network access
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          smoke_config=$(mktemp)
          trap 'rm -f "$smoke_config"' EXIT
          printf '%s\n' '{"users":[{"username":"offline-a","password":"dummy-a"},{"username":"offline-b","password":"dummy-b"}],"dingtalk":{"enabled":false}}' > "$smoke_config"
          chmod 644 "$smoke_config"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --network none "$IMAGE" --help
            docker run --rm --platform "$platform" --network none "$IMAGE" \
              --username offline-smoke --password dummy-smoke --dry-run
            docker run --rm --platform "$platform" --network none \
              --mount "type=bind,source=$smoke_config,target=/data/config.json,readonly" \
              "$IMAGE" --dry-run | grep -F 'Resolved 2 account(s)'
            docker run --rm --platform "$platform" --network none \
              --entrypoint node "$IMAGE" zdbk.zju/gradeMonitor.js --help
          done
